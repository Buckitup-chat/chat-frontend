<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="theme-color" content="#241824" />
	<title>PQ2 handshake sandbox</title>
  <script type="module" crossorigin src="./assets/index-LQ6TES_8.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-gtskzPU6.css">
</head>
<body>
	<header>
		<div>
			<div class="title">PQ2 handshake sandbox</div>
			<div class="who" id="who"></div>
		</div>
		<button id="settingsBtn" class="ghost" aria-label="Settings">⚙︎</button>
	</header>

	<section id="settings" hidden>
		<label>Name <input id="name" autocomplete="off" /></label>
		<label>Channel
			<select id="channel">
				<option value="none">STUN off — phones on one network</option>
				<option value="stun">STUN on — Google, across networks</option>
				<option value="turn">TURN — through a relay server</option>
				<option value="frames">Animated QR — no network</option>
			</select>
		</label>
		<label>TURN server URL
			<input id="turnUrl" autocomplete="off" placeholder="turn:host:port?transport=tcp" />
		</label>
		<label>TURN user <input id="turnUser" autocomplete="off" /></label>
		<label>TURN password <input id="turnPass" type="password" autocomplete="off" /></label>
		<label class="check"><input id="relayOnly" type="checkbox" /> TURN: offer the relay's addresses only</label>
		<label>Animated QR: frame size
			<select id="frameSize">
				<option value="small">Small — more frames, easier to read</option>
				<option value="medium">Medium</option>
				<option value="large">Large — fewer frames, harder to read</option>
			</select>
		</label>
		<label>Animated QR: frames per second
			<select id="fps">
				<option value="3">3</option>
				<option value="5">5</option>
				<option value="8">8</option>
			</select>
		</label>
		<label>Camera
			<select id="camera">
				<option value="user">Front (face to face)</option>
				<option value="environment">Back</option>
			</select>
		</label>
		<label>Mode
			<select id="mode">
				<option value="honest">Honest</option>
				<option value="impostor">Impostor — show another identity</option>
			</select>
		</label>
		<div class="row">
			<button id="newIdentity" class="ghost">New identity</button>
			<button id="applySettings">Apply and restart</button>
		</div>
		<p class="hint" id="impostorHint"></p>
	</section>

	<main>
		<div id="stage" class="stage"></div>
		<div id="result" hidden></div>
		<div id="qrWrap" class="qr"><canvas id="qr"></canvas></div>
		<video id="video" playsinline muted></video>
		<div class="row">
			<button id="restart">New session</button>
			<button id="manual" class="ghost">Paste a code</button>
			<button id="copy" class="ghost">Copy my code</button>
		</div>
		<details id="timingsBox" hidden><summary>Timings</summary><ul id="timings"></ul></details>
		<details open><summary>Log</summary><ol id="log" reversed></ol></details>
	</main>

</body>
</html>
